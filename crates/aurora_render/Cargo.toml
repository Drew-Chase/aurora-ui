[package]
name = "aurora_render"
version = "0.1.0"
edition = "2024"

[dependencies]
aurora_core = { path = "../aurora_core" }
aurora_text = { path = "../aurora_text", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
usvg = { version = "0.47", optional = true, default-features = false }
tiny-skia = { version = "0.12", optional = true }

[features]
text = ["dep:aurora_text"]
image = ["dep:image"]
svg = ["dep:usvg", "dep:tiny-skia"]