[package]
name = "aurora_gpu"
version = "0.1.0"
edition = "2024"
description = "GPU abstraction — thin wrapper"

[dependencies]
aurora_core = { path = "../aurora_core" }
log = "0.4"

winit = "0.30"
softbuffer = { version = "0.4", optional = true }
glow = { version = "0.16", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["software"]
software = ["dep:softbuffer"]
opengl = ["dep:glow", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]
wgpu_backend = ["dep:wgpu", "dep:pollster"]