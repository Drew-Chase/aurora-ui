[package]
name = "aurora_fonts"
version = "0.1.0"
edition = "2024"
description = "Compile-time Google Fonts embedding — type-safe access to 1,600+ font families with zero runtime cost"
authors = ["Drew Chase"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drew-chase/aurora-ui"
homepage = "https://github.com/drew-chase/aurora-ui"
documentation = "https://github.com/Drew-Chase/aurora-ui/wiki/Fonts"
readme = "README.md"
keywords = ["fonts", "google-fonts", "compile-time", "proc-macro", "embedded"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
ureq = "3"
serde_json = "1"
