[package]
name = "aurora_iconify"
version = "0.1.2"
edition = "2024"
description = "Compile-time icon embedding from iconify.design — type-safe access to 200,000+ icons with zero runtime cost"
authors = ["Drew Chase"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drew-chase/aurora-ui"
homepage = "https://github.com/drew-chase/aurora-ui"
documentation = "https://github.com/Drew-Chase/aurora-ui/wiki/Iconify"
readme = "README.md"
keywords = ["icons", "iconify", "svg", "compile-time", "proc-macro"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
ureq = "3"
serde_json = "1"
