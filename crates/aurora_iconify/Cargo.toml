[package]
name = "aurora_iconify"
version = "0.4.0"
edition = "2024"
description = "Type-safe access to Iconify icons, embedding only the ones your crate uses"
authors = ["Drew Chase"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drew-chase/aurora-ui"
homepage = "https://github.com/drew-chase/aurora-ui"
documentation = "https://github.com/Drew-Chase/aurora-ui/wiki/Iconify"
readme = "README.md"
keywords = ["icons", "iconify", "svg", "compile-time", "proc-macro"]
categories = ["gui", "development-tools::procedural-macro-helpers"]
# Maintainer notes, not part of the published crate.
exclude = ["PLAN-ide-performance.md"]

[features]
default = ["previews"]
# Hover previews (`![name](url)` documentation) for each icon. Turn off to
# shrink the generated code.
previews = []
# BEGIN GENERATED SET FEATURES (cargo run -p xtask -- iconify-catalog)
lucide = []
mage = []
material-symbols = []
# END GENERATED SET FEATURES

[dependencies]
aurora_iconify_macros = { version = "=0.4.0", path = "../aurora_iconify_macros" }

[dev-dependencies]
aurora_iconify_catalog = { version = "=0.4.0", path = "../aurora_iconify_catalog" }

[package.metadata.docs.rs]
features = ["lucide"]
