[package]
name = "aurora_ui"
version = "0.1.0"
edition = "2024"
description = "A GPU-accelerated, feature-gated UI framework for building fast, lightweight desktop applications in Rust. Custom Win11/macOS titlebars. ~1.2 MB minimal binary. Sub-100ms startup."
authors = ["Drew Chase"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drew-chase/aurora-ui"
homepage = "https://github.com/drew-chase/aurora-ui"
documentation = "https://github.com/Drew-Chase/aurora-ui/wiki"
readme = "../README.md"
keywords = ["gui", "ui", "desktop", "gpu", "framework"]
categories = ["gui", "graphics", "rendering"]
exclude = ["examples/", ".wiki/", ".github/"]

[dependencies]
aurora_core = { path = "../crates/aurora_core" }
aurora_macros = { path = "../crates/aurora_macros" }
aurora_platform = { path = "../crates/aurora_platform" }
aurora_gpu = { path = "../crates/aurora_gpu" }
aurora_render = { path = "../crates/aurora_render" }
aurora_widgets = { path = "../crates/aurora_widgets" }
aurora_text = { path = "../crates/aurora_text", optional = true }
aurora_animate = { path = "../crates/aurora_animate", optional = true }


[features]
default = ["software"]
software = ["aurora_gpu/software"]
opengl = ["aurora_gpu/opengl", "aurora_platform/opengl"]
wgpu_backend = ["aurora_gpu/wgpu_backend", "aurora_platform/wgpu_backend"]
text = ["dep:aurora_text", "aurora_platform/text", "aurora_render/text", "aurora_widgets/text"]
image = ["aurora_platform/image", "aurora_render/image", "aurora_widgets/image"]
svg = ["aurora_platform/svg", "aurora_render/svg", "aurora_widgets/svg"]
animate = ["dep:aurora_animate"]