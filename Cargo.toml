[workspace]
resolver = "3"
members = [
    "aurora",
    "crates/aurora_a11y",
    "crates/aurora_animate",
    "crates/aurora_core",
    "crates/aurora_macros",
    "crates/aurora_iconify",
    "crates/aurora_fonts",
    "crates/aurora_gpu",
    "crates/aurora_layout",
    "crates/aurora_platform",
    "crates/aurora_render",
    "crates/aurora_text",
    "crates/aurora_theme",
    "crates/aurora_theming",
    "crates/aurora_syntax",
    "crates/aurora_widgets",
    "crates/aurora_i18n",
    "crates/aurora_lang",
    "examples/layout_example",
    "examples/minimal",
    "examples/text_example",
    "examples/button_example",
    "examples/counter_example",
    "examples/custom_titlebar_example",
    "examples/scrollview_example",
    "examples/image_example",
    "examples/text_input_example",
    "examples/custom_widget",
    "examples/iconify_example",
    "examples/fonts_example",
    "examples/animation_example",
    "examples/widget_gallery",
    "examples/file_dialog_example",
    "examples/drag_drop_example",
    "examples/i18n_example",
    "examples/multi_window_example",
    "examples/tray_menu_example"
]
default-members = [
    "aurora",
    "crates/aurora_animate",
    "crates/aurora_core",
    "crates/aurora_macros",
    "crates/aurora_gpu",
    "crates/aurora_platform",
    "crates/aurora_render",
    "crates/aurora_text",
    "crates/aurora_theme",
    "crates/aurora_theming",
    "crates/aurora_widgets",
    "crates/aurora_i18n"
]

[workspace.dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# ---------- SHARED PROFILES ----------
# These apply to ALL workspace members automatically.

[profile.dev]
opt-level = 1              # faster dev builds than 0, much faster iteration
incremental = true
debug = "line-tables-only" # smaller debug info, still get backtraces

[profile.dev.package."*"]  # optimize dependencies even in dev
opt-level = 2              # deps don't change often, optimize them fully

[profile.release]
opt-level = "z"            # optimize for size over speed
lto = "fat"                # full link-time optimization — slow build, small binary
codegen-units = 1          # max optimization (single codegen unit)
panic = "abort"            # removes unwinding tables (~100-200 KB savings)
strip = "symbols"          # strip debug symbols from binary

[profile.release-fast]     # alternative: optimize for speed when profiling
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1

# Specific overrides — optimize critical hot-path crates even in dev
[profile.dev.package.aurora_render]
opt-level = 2

[profile.dev.package.aurora_gpu]
opt-level = 2
